[project]
name = "torobcar-backend"
version = "0.1.0"
description = "Torobcar search API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-ai-slim[google,openai]>=2.45.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.uv]
package = false
# Wait out a publication cooldown before resolving a newly released version, so a
# compromised release has time to be caught and yanked before it reaches a build.
# A rolling window, not a pinned date: a date would silently freeze resolution until
# someone remembered to bump it. Needs uv 0.9.17+ — an older uv reports it as a date
# parse error ("failed to parse year in date"), so run `uv self update` if you see that.
required-version = ">=0.9.17"
exclude-newer = "7 days"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["db: needs the Postgres test database (.docker/compose.test.yml)"]

[tool.coverage.run]
omit = ["tests/*", "db/migrations/*"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
