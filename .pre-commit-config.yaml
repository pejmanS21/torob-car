repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Bundled crawl data; keep the size limit for every other file.
        exclude: ^assets\.zip$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff # lint only (Black handles formatting)
        args: [--fix]
        files: ^backend/
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      # Docker variant: the golang hook builds gitleaks from source, which needs
      # a Go toolchain downloaded from dl.google.com — unreachable on some networks.
      - id: gitleaks-docker
